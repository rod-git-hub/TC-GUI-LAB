# TC Lab kernel modules — copy to /etc/modules-load.d/ on the container host
# so they are present before the container starts (host networking means the
# container cannot modprobe them itself).
#
# br_netfilter is deliberately NOT here. It exists to push *bridged* frames
# through iptables, which a pure L2 impairment path never wants — and Docker,
# which loads it anyway, also sets the FORWARD policy to DROP. See
# sysctl.d/tc-lab.conf.
