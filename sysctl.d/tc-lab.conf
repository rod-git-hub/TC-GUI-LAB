# TC Lab — keep bridged frames out of iptables.
#
# Copy to /etc/sysctl.d/ on any host where TC Lab bridges carry lab traffic AND
# something may load br_netfilter. Docker does, on install; loading it defaults
# these three to 1, and Docker also sets the iptables FORWARD policy to DROP.
# Together that sends frames bridged between two lab interfaces through the
# FORWARD chain, where they are dropped — the bridge looks up and correctly
# configured, traffic simply stops.
#
# The leading "-" means "ignore if the key does not exist", so this file is
# harmless on a host where br_netfilter was never loaded.
#
# Apply now:  sudo sysctl --system
-net.bridge.bridge-nf-call-iptables = 0
-net.bridge.bridge-nf-call-ip6tables = 0
-net.bridge.bridge-nf-call-arptables = 0
